network:
  version: 2
  renderer: networkd
  wifis:
    wlan0:
      dhcp4: no
      dhcp6: no
      addresses: [192.168.1.100/24]
      nameservers:
        addresses: [192.168.1.1, 8.8.8.8, 1.1.1.1]
      access-points:
        "SSID":
          password: "PASSWORD"
      routes:
        - to: default
          via: 192.168.1.1